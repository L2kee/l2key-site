name: Social posts

# Turns a week file (social/<week>.json) into carousel slides served from evogencyglobal.com/social/
# and schedules them in Buffer (Instagram, Facebook, TikTok). No AI involved.
# Runs when a week file is pushed, or by hand: mode "channels" only lists the Buffer channels.
on:
  push:
    branches: [master]
    paths: ["social/*.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "channels (list only) or schedule"
        default: channels
      week:
        description: "Week file for schedule mode, e.g. social/2026-10-05.json"
        default: ""

concurrency:
  group: social-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2

      - name: List Buffer channels
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'channels'
        run: python3 social/schedule.py channels

      - name: Pick the week files
        id: weeks
        if: github.event_name == 'push' || inputs.mode == 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            files=$(git diff --name-only HEAD~1 HEAD -- 'social/*.json' | grep -v '^social/state/' || true)
          else
            files="${{ inputs.week }}"
          fi
          echo "files=$(echo $files)" >> "$GITHUB_OUTPUT"
          echo "Week files: $files"

      - name: Render slides
        if: steps.weeks.outputs.files != ''
        run: |
          npm install --prefix /tmp/pw playwright@1 >/dev/null
          (cd /tmp/pw && npx playwright install --with-deps chromium >/dev/null)
          for f in ${{ steps.weeks.outputs.files }}; do NODE_PATH=/tmp/pw/node_modules node social/render.js "$f"; done

      - name: Publish slides to the site
        if: steps.weeks.outputs.files != ''
        run: |
          git config user.name "Social Posts"
          git config user.email "actions@users.noreply.github.com"
          git add public/social
          git diff --cached --quiet && exit 0
          git commit -m "Social slides for ${{ steps.weeks.outputs.files }}"
          for i in 1 2 3 4; do
            { git pull --rebase origin master || { git rebase --abort; exit 1; }; } && git push origin HEAD:master && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Schedule in Buffer
        if: steps.weeks.outputs.files != ''
        run: |
          rc=0
          for f in ${{ steps.weeks.outputs.files }}; do python3 social/schedule.py schedule "$f" || rc=1; done
          exit $rc

      - name: Save Buffer post ids
        if: always() && steps.weeks.outputs.files != ''
        run: |
          git add social/state 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Social: Buffer post ids for ${{ steps.weeks.outputs.files }}"
          for i in 1 2 3 4; do
            { git pull --rebase origin master || { git rebase --abort; exit 1; }; } && git push origin HEAD:master && exit 0
            sleep $((i * 5))
          done
          exit 1
